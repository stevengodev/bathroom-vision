spring.config.import=secret.properties

server.port=8081
  
spring.application.name=vision-bathroom
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require&channel_binding=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Configuraciones propias de la aplicación
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-ms=86400000
app.security.google.client-id=${GOOGLE_CLIENT_ID}
app.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH}
app.notification.topic=bathrooms